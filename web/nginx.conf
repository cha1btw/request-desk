server {
  listen 80;
  server_tokens off; # do not announce the nginx version
  root /usr/share/nginx/html;
  index index.html;

  # Compress text files (the JS bundle shrinks to roughly a third).
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers, sent with every answer.
  # The CSP only allows scripts, styles and requests from our own address.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # The browser calls /api/... on this same address; nginx passes it to the api container.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API reads the client IP from here (needed for the login rate limit).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vite puts a hash in these file names (index-Bo4HsFic.js), so a changed file
  # always gets a new name and the old one can be cached for a year.
  location /assets/ {
    expires 1y;
  }

  # index.html is never cached: it points to the current hashed files.
  location = /index.html {
    expires -1;
  }

  # React Router handles URLs like /requests/5 in the browser. For any path
  # that is not a real file, send index.html and let the app decide.
  location / {
    try_files $uri /index.html;
  }
}
